[project]
name = "trenfy"
version = "0.1.0"
description = "Trenfy - Trend-Catching Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "python-dotenv",
    "beautifulsoup4",
    "lxml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trend_agents", "tools"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]
