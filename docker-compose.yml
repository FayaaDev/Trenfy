# Trenfy — Trend-Catching Platform
services:
  trenfy-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: trenfy-backend:latest
    container_name: trenfy-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - NOCODB_API_URL=http://nocodb:8080
    depends_on:
      nocodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  nocodb:
    image: nocodb/nocodb:latest
    container_name: trenfy-nocodb
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - nocodb_data:/usr/app/data
    environment:
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET:-change_me_in_production}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  nocodb_data:
