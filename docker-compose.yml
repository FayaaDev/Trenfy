# Trenfy — Trend-Catching Platform
services:
  trenfy-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: trenfy-backend:latest
    container_name: trenfy-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - NOCODB_API_URL=https://nocodb.fayaa92.sa
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
